# Tooling config only - the app is run from app/main.py, not installed as a package.
[tool.ruff]
line-length = 110
target-version = "py311"
# Generated by Alembic, not hand-maintained - reformatting it only creates diff noise.
exclude = ["alembic/versions", "venv"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, flake8-bugbear, flake8-comprehensions.
select = ["E", "F", "I", "UP", "B", "C4"]

[tool.ruff.lint.flake8-bugbear]
# B008 bans function calls in argument defaults, but that call *is* how FastAPI declares
# a dependency or a header binding. Exempt the framework's own markers, keep the rule.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query", "fastapi.Path"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
